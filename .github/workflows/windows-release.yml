name: Publish Windows Preview Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-release.yml"
      - "installer/windows/EmberCorridor.iss"
      - "release/VERSION"

permissions:
  contents: write

concurrency:
  group: windows-preview-release
  cancel-in-progress: false

jobs:
  build-test-release:
    name: Build, install-test, and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.7.1"
      PORTABLE_ASSET: EmberCorridor-M1-Preview-Portable-x64.zip
      INSTALLER_ASSET: EmberCorridor-M1-Preview-Setup-x64.exe

    steps:
      - name: Check out main source
        uses: actions/checkout@v4

      - name: Validate repository contract
        run: python tools/validate_project.py

      - name: Download Godot 4.7.1 for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "godot-windows.zip"
          $destination = Join-Path $env:RUNNER_TEMP "godot-windows"
          Invoke-WebRequest `
            -Uri "https://downloads.godotengine.org/?flavor=stable&platform=windows.64&slug=win64.exe.zip&version=$env:GODOT_VERSION" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $downloadedGodot = Get-ChildItem `
            -Path $destination `
            -Filter "Godot_v4.7.1-stable_win64.exe" `
            -File `
            -Recurse `
            | Select-Object -First 1
          if ($null -eq $downloadedGodot) {
            throw "Godot 4.7.1 Windows executable was not found"
          }
          $godot = Join-Path $env:RUNNER_TEMP "godot.exe"
          Copy-Item $downloadedGodot.FullName $godot
          Add-Content -Path $env:GITHUB_PATH -Value $env:RUNNER_TEMP
          $versionOutput = & $godot --version 2>&1
          $versionExitCode = $LASTEXITCODE
          $versionOutput
          if ($null -ne $versionExitCode -and $versionExitCode -ne 0) {
            throw "Godot version check failed with code $versionExitCode"
          }
          if (-not ($versionOutput -match "^4\.7\.1\.stable")) {
            throw "Downloaded Windows Godot version is not 4.7.1 Stable"
          }

      - name: Install official Godot export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "godot-export-templates.zip"
          $destination = Join-Path $env:RUNNER_TEMP "godot-export-templates"
          Invoke-WebRequest `
            -Uri "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=$env:GODOT_VERSION" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $templateDirectory = Join-Path `
            $env:APPDATA `
            "Godot\export_templates\4.7.1.stable"
          New-Item -ItemType Directory -Force -Path $templateDirectory | Out-Null
          Copy-Item `
            -Path (Join-Path $destination "templates\*") `
            -Destination $templateDirectory `
            -Recurse `
            -Force
          if (-not (Test-Path (Join-Path $templateDirectory "windows_debug_x86_64.exe"))) {
            throw "Windows x86-64 export template was not installed"
          }

      - name: Import and validate Resource data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/test-results/release | Out-Null
          & godot.exe --headless --path . --import --quit 2>&1 `
            | Tee-Object -FilePath build/test-results/release/import.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Godot project import failed with code $LASTEXITCODE"
          }
          & godot.exe --headless --path . --script res://scripts/tools/validate_data.gd 2>&1 `
            | Tee-Object -FilePath build/test-results/release/data-validation.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Resource validation failed with code $LASTEXITCODE"
          }
          if (-not (Select-String `
            -Path build/test-results/release/data-validation.txt `
            -Pattern "PASS: loaded and validated 8 definition(s)" `
            -SimpleMatch `
            -Quiet)) {
            throw "Expected 8 validated definitions were not reported"
          }

      - name: Run 64 game tests natively on Windows
        shell: pwsh
        run: |
          & godot.exe --headless --path . --script res://tests/test_runner.gd 2>&1 `
            | Tee-Object -FilePath build/test-results/release/game-tests.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Windows game tests failed with code $LASTEXITCODE"
          }
          if (-not (Select-String `
            -Path build/test-results/release/game-tests.txt `
            -Pattern "PROJECT TEST SUMMARY: 64 passed, 0 failed" `
            -Quiet)) {
            throw "Expected 64-test success summary was not found"
          }
          if (Select-String `
            -Path build/test-results/release/game-tests.txt `
            -Pattern "^(SCRIPT )?ERROR:" `
            -Quiet) {
            throw "Windows game tests logged a Godot runtime error"
          }

      - name: Export Windows x86-64 game
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          New-Item -ItemType Directory -Force -Path build/release | Out-Null
          & godot.exe `
            --headless `
            --path . `
            --export-debug "Windows Desktop" `
            build/windows/EmberCorridor.exe 2>&1 `
            | Tee-Object -FilePath build/test-results/release/export.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Windows export failed with code $LASTEXITCODE"
          }
          if (-not (Test-Path build/windows/EmberCorridor.exe)) {
            throw "EmberCorridor.exe was not exported"
          }
          $bytes = [System.IO.File]::ReadAllBytes(
            (Resolve-Path build/windows/EmberCorridor.exe)
          )
          if ($bytes.Length -lt 256 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Exported game is not a Windows PE executable"
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Exported game is not x86-64: PE machine 0x{0:X4}" -f $machine)
          }
          Copy-Item licenses/GODOT-ENGINE-LICENSE.md build/windows/GODOT-ENGINE-LICENSE.md
          Copy-Item docs/ASSET-LICENSE-REGISTER.csv build/windows/ASSET-LICENSE-REGISTER.csv
          Compress-Archive `
            -Path build/windows/* `
            -DestinationPath (Join-Path build/release $env:PORTABLE_ASSET) `
            -CompressionLevel Optimal `
            -Force

      - name: Run exported game before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stdout = Join-Path $PWD "build/test-results/release/exported.stdout.txt"
          $stderr = Join-Path $PWD "build/test-results/release/exported.stderr.txt"
          $process = Start-Process `
            -FilePath (Resolve-Path build/windows/EmberCorridor.exe) `
            -ArgumentList @("--headless", "--quit-after", "120") `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "Exported game did not exit within 30 seconds"
          }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
            throw "Exported game exited with code $($process.ExitCode)"
          }
          $combinedLog = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
          if ($combinedLog -notmatch "\[JuggleSandbox\] CMB-006 airborne control ready") {
            throw "Exported game did not reach the playable CMB-006 scene"
          }
          if ($combinedLog -match "(?m)^(SCRIPT )?ERROR:") {
            throw "Exported game logged a Godot runtime error"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with code $LASTEXITCODE"
          }
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($null -eq $compiler) {
            $fallback = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $fallback)) {
              throw "ISCC.exe was not found after installing Inno Setup"
            }
            $compilerPath = $fallback
          } else {
            $compilerPath = $compiler.Source
          }
          & $compilerPath installer/windows/EmberCorridor.iss 2>&1 `
            | Tee-Object -FilePath build/test-results/release/installer-build.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed with code $LASTEXITCODE"
          }
          if (-not (Test-Path (Join-Path build/release $env:INSTALLER_ASSET))) {
            throw "Expected Windows installer was not produced"
          }

      - name: Install and run the packaged game
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDirectory = Join-Path $env:RUNNER_TEMP "ember-corridor-installed"
          $installer = Resolve-Path (Join-Path build/release $env:INSTALLER_ASSET)
          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/DIR=$installDirectory"
            ) `
            -Wait `
            -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)"
          }
          $installedGame = Join-Path $installDirectory "EmberCorridor.exe"
          if (-not (Test-Path $installedGame)) {
            throw "Installer did not place EmberCorridor.exe"
          }
          $exportedHash = (
            Get-FileHash -Path build/windows/EmberCorridor.exe -Algorithm SHA256
          ).Hash
          $installedHash = (
            Get-FileHash -Path $installedGame -Algorithm SHA256
          ).Hash
          if ($installedHash -ne $exportedHash) {
            throw "Installed game does not match the tested exported executable"
          }
          $stdout = Join-Path $PWD "build/test-results/release/installed.stdout.txt"
          $stderr = Join-Path $PWD "build/test-results/release/installed.stderr.txt"
          $game = Start-Process `
            -FilePath $installedGame `
            -ArgumentList @("--headless", "--quit-after", "120") `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          if (-not $game.WaitForExit(30000)) {
            Stop-Process -Id $game.Id -Force
            throw "Installed game did not exit within 30 seconds"
          }
          $game.WaitForExit()
          if ($game.ExitCode -ne 0) {
            throw "Installed game exited with code $($game.ExitCode)"
          }
          $combinedLog = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
          if ($combinedLog -notmatch "\[DataRegistry\] Loaded 8 definition\(s\)") {
            throw "Installed game did not load its packaged Resource definitions"
          }
          if ($combinedLog -notmatch "\[JuggleSandbox\] CMB-006 airborne control ready") {
            throw "Installed game did not reach the playable CMB-006 scene"
          }
          if ($combinedLog -match "(?m)^(SCRIPT )?ERROR:") {
            throw "Installed game logged a Godot runtime error"
          }

      - name: Generate release checksums and notes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assetNames = @($env:INSTALLER_ASSET, $env:PORTABLE_ASSET)
          $checksumLines = foreach ($assetName in $assetNames) {
            $assetPath = Join-Path build/release $assetName
            $hash = (Get-FileHash -Path $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $assetName"
          }
          $checksumLines | Set-Content `
            -Path build/release/SHA256SUMS.txt `
            -Encoding ascii
          $version = (Get-Content release/VERSION -Raw).Trim()
          @"
          # Ember Corridor M1 Playable Preview $version

          This is the first stable playable Windows checkpoint from main.

          - Setup: install per-user, create Start Menu and desktop shortcuts, then launch.
          - Portable: extract the ZIP and run EmberCorridor.exe.
          - Controls: WASD move, J attack, K jump, L dodge, Esc pause.
          - Validation: 64 tests plus native export, installer, and installed-game launch checks.

          This preview is unsigned, so Windows may display an unknown-publisher warning.
          "@ | Set-Content -Path build/release/RELEASE_NOTES.md -Encoding utf8

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ember-corridor-release-candidate
          path: |
            build/release/EmberCorridor-M1-Preview-Setup-x64.exe
            build/release/EmberCorridor-M1-Preview-Portable-x64.zip
            build/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Get-Content release/VERSION -Raw).Trim()
          $tag = "v$version"
          $installer = Join-Path build/release $env:INSTALLER_ASSET
          $portable = Join-Path build/release $env:PORTABLE_ASSET
          $checksums = Join-Path build/release "SHA256SUMS.txt"
          $notes = Join-Path build/release "RELEASE_NOTES.md"

          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            & gh release upload `
              $tag `
              $installer `
              $portable `
              $checksums `
              --clobber `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "Existing release asset upload failed with code $LASTEXITCODE"
            }
            & gh release edit `
              $tag `
              --title "Ember Corridor M1 Playable Preview $version" `
              --notes-file $notes `
              --prerelease `
              --repo $env:GITHUB_REPOSITORY
          } else {
            & gh release create `
              $tag `
              $installer `
              $portable `
              $checksums `
              --target $env:GITHUB_SHA `
              --title "Ember Corridor M1 Playable Preview $version" `
              --notes-file $notes `
              --prerelease `
              --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed with code $LASTEXITCODE"
          }
          & gh release view $tag --repo $env:GITHUB_REPOSITORY
